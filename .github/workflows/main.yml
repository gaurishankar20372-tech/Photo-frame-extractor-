name: Build Photo Frame Extractor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Java
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # 4. Install Dependencies
      - name: Install Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli vite

      # 5. Build Web App
      - name: Build Web App
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            npx vite build
          fi

      # 6. Configure Capacitor
      - name: Configure Capacitor
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "Photo Frame Extractor" \
              "com.mg.photoframeextractor" \
              --web-dir dist
          fi

      # 7. Setup Android
      - name: Setup Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      # 8. Android Permissions
      - name: Configure Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            for PERMISSION in \
              android.permission.INTERNET \
              android.permission.ACCESS_NETWORK_STATE \
              android.permission.RECORD_AUDIO \
              android.permission.MODIFY_AUDIO_SETTINGS
            do
              if ! grep -q "$PERMISSION" "$MANIFEST"; then
                sed -i "/<manifest/a\\    <uses-permission android:name=\"$PERMISSION\" />" "$MANIFEST"
              fi
            done
          fi

      # 9. Build APK
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 10. Prepare APK
      - name: Prepare APK
        run: |
          mkdir -p release

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not generated!"
            exit 1
          fi

          cp "$APK" "release/Photo Frame Extractor.apk"

          ls -lh release/

      # 11. Upload Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO-FRAME-EXTRACTOR-APK
          path: "release/Photo Frame Extractor.apk"
          retention-days: 30

      # 12. GitHub Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"

          gh release create "$TAG" \
            "release/Photo Frame Extractor.apk" \
            --title "Photo Frame Extractor $TAG" \
            --notes "Photo Frame Extractor Android APK" \
            --latest
