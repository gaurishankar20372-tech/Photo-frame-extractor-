name: Build Photo Frame Extractor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Build web app
        run: |
          npm run build

      - name: Initialize Capacitor & Android Platform
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Photo Frame Extractor" "com.mg.photoframeextractor" --web-dir dist
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Configure Android Permissions
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST_FILE" ]; then
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST_FILE"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_FILE"
            fi

            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST_FILE"
          fi

          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          cat << 'EOF' >> android/build.gradle

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      eachDependency { DependencyResolveDetails details ->
                          if (details.requested.group == "org.jetbrains.kotlin" &&
                              (details.requested.name == "kotlin-stdlib-jdk7" ||
                               details.requested.name == "kotlin-stdlib-jdk8")) {
                              details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                          }
                      }
                  }
              }
          }
          EOF

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/Photo Frame Extractor.apk"

          echo "Generated APK file details:"
          ls -lh "release/Photo Frame Extractor.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO-FRAME-EXTRACTOR-APK
          path: "release/Photo Frame Extractor.apk"
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"

          gh release create "$TAG" \
            "release/Photo Frame Extractor.apk" \
            --title "Photo Frame Extractor $TAG" \
            --notes "Photo Frame Extractor APK release. Built automatically from the main branch via GitHub Actions." \
            --latest || echo "Release create step completed."
